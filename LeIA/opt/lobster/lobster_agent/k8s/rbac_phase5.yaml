# Phase 5 mutation permissions for Matrix.
# Apply with:
#   kubectl apply -f lobster_agent/k8s/rbac_phase5.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: leia-agent-mutations
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
    # ONLY for wordpress DB passwords. No update/patch; secrets are write-once.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  # namespace scoping is enforced by policy.py, not RBAC,
  # because ClusterRole cannot scope by namespace label.
  # Policy rejects non-tenant namespaces before K8s is called.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: leia-agent-mutations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: leia-agent-mutations
subjects:
  - kind: ServiceAccount
    name: lobster-reader
    namespace: saasphere-system
