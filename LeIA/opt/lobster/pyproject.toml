[project]
name = "lobster-agent"
version = "0.1.0"
description = "SaaSphere AI infrastructure orchestration agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "pydantic-ai-slim[openai]>=1.93.0",
    "sqlmodel>=0.0.38",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "typer>=0.25.1",
    "lightkube>=0.19.1",
    "lightkube-models>=1.35.0.8",
    "cryptography>=48.0.0",
    "aiogram>=3.13",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "apscheduler>=3.10",
    "pytz>=2024.1",
]

[project.scripts]
lobster = "lobster_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=2.0.0",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
