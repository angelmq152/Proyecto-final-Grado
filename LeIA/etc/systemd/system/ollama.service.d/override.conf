[Service]
# Ubicación de los modelos en la partición grande /mnt/modelos
Environment="OLLAMA_MODELS=/mnt/modelos/ollama/models"

# Bind solo a localhost (defensa en profundidad)
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Mantener el modelo en VRAM 15 minutos tras la última petición.
# Por defecto son 5 min — subimos a 15 porque Lobster dispara cada 5
# y no queremos pagar coste de carga repetidamente.
Environment="OLLAMA_KEEP_ALIVE=15m"

# Una petición concurrente — la 3060 Ti no tiene VRAM para más.
Environment="OLLAMA_NUM_PARALLEL=1"

# Un modelo cargado a la vez — al pedir otro, descarga el anterior.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Flash Attention reduce ~30% el VRAM del KV cache (soportado en Ampere).
Environment="OLLAMA_FLASH_ATTENTION=1"

# Cuantizar el KV cache a 8-bit — más contexto cabe en VRAM con
# pérdida de calidad despreciable. Requiere Flash Attention activo.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
