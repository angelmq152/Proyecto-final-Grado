[global]
   workgroup = WORKGROUP
   server string = OpenClaw Samba
   security = user
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000
   server min protocol = SMB2
   ntlm auth = yes
   dns proxy = no

[opt]
   comment = /opt share
   path = /opt
   valid users = angel
   read only = no
   browsable = yes
   create mask = 0664
   directory mask = 0775
   force user = angel
