global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: saasphere
    monitor: sauron

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'node'
    static_configs:
      - targets: ['192.168.1.201:9100']
        labels:
          instance: sauron
      - targets: ['192.168.1.202:9100']
        labels:
          instance: matrix
      - targets: ['192.168.1.203:9100']
        labels:
          instance: heimdall
      - targets: ['192.168.1.200:9100']
        labels:
          instance: leia
      - targets: ['192.168.1.210:9100']
        labels:
          instance: fallback

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['192.168.1.202:30080']
        labels:
          instance: matrix

  - job_name: 'blackbox_icmp'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - 192.168.1.202
          - 192.168.1.203
          - 192.168.1.200
          - 192.168.1.210
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'openclaw'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.1.200:8080']
        labels:
          instance: leia
          service: openclaw
