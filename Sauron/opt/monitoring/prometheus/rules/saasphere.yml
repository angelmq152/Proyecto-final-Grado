groups:
  - name: nodos
    rules:
      - alert: NodoInaccesible
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Nodo {{ $labels.instance }} sin respuesta"

      - alert: MemoriaAlta
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria al {{ $value | printf \"%.0f\" }}% en {{ $labels.instance }}"

      - alert: DiscoLleno
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco al {{ $value | printf \"%.0f\" }}% en {{ $labels.instance }}"

      - alert: CargaCPUAlta
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU al {{ $value | printf \"%.0f\" }}% en {{ $labels.instance }}"

  - name: kubernetes
    rules:
      - alert: PodCaido
        expr: kube_pod_status_phase{phase=~"Failed|Unknown"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} en estado {{ $labels.phase }}"

      - alert: PodReiniciando
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 900 > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} reiniciando frecuentemente"
